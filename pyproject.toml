[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "latency-bench"
version = "0.1.0"
description = "Who sees the tennis point first: multi-source live-score latency harness (Live Tennis API, Polymarket, Kalshi)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "websockets>=12"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
latency-bench = "latency_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/latency_bench"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
